<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders — InvTrack</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-layout">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">&#9783;</div>
      <div>
        <div class="brand-name">InvTrack</div>
        <div class="brand-sub">Inventory Manager</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main Menu</div>
      <a href="index.html" class="nav-item" data-href="index.html">
        <span class="nav-icon">&#9783;</span> Dashboard
      </a>
      <a href="inventory.html" class="nav-item" data-href="inventory.html">
        <span class="nav-icon">&#9741;</span> Inventory
      </a>
      <a href="orders.html" class="nav-item active" data-href="orders.html">
        <span class="nav-icon">&#128666;</span> Orders
      </a>
      <a href="reports.html" class="nav-item" data-href="reports.html">
        <span class="nav-icon">&#128202;</span> Reports
      </a>
      <a href="restocking.html" class="nav-item" data-href="restocking.html">
        <span class="nav-icon">&#128230;</span> Restocking
      </a>
    </nav>
    <div class="sidebar-footer">&#169; 2025 InvTrack</div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="topbar">
      <div>
        <div class="topbar-title">Orders</div>
        <div class="topbar-subtitle">All customer orders</div>
      </div>
      <div class="topbar-actions">
        <span id="orders-count" class="badge badge-gray">— orders</span>
      </div>
    </div>

    <div class="page-content">
      <div class="card section-gap">
        <div class="card-header">
          <span class="card-title">Order List</span>
        </div>
        <div class="card-body" style="padding-bottom: 0">
          <div class="filter-btn-group">
            <button class="filter-btn active" data-filter="All">All</button>
            <button class="filter-btn" data-filter="Pending">Pending</button>
            <button class="filter-btn" data-filter="Shipped">Shipped</button>
            <button class="filter-btn" data-filter="Delivered">Delivered</button>
            <button class="filter-btn" data-filter="Cancelled">Cancelled</button>
            <button class="filter-btn" data-filter="Restocking">Restocking</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Product</th>
                <th>Qty</th>
                <th>Status</th>
                <th>Order Date</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody id="orders-body">
              <tr><td colspan="7" class="empty-state">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div><!-- /page-content -->
  </div><!-- /main-content -->
</div><!-- /app-layout -->

<script src="js/app.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
